function fullTbl(id){var vs=VB[id];var h="<section class='c'><h3>2-2. 전체 활용표 · Bảng chia đầy đủ <small>(🔊 bấm vào ô để nghe)</small></h3><div class='tbl full'><table><tr><th>어미 · Đuôi từ</th>"+vs.map(function(x){return "<th>"+x[0]+"다<br><small>"+(x[1]=="v"?"동사 · ĐT":"형용사 · TT")+"</small></th>"}).join("")+"</tr>";
 EM.forEach(function(e){h+="<tr><td>"+e[1]+"<br><small>"+e[2]+"</small></td>"+vs.map(function(x){var f=conj(id,x[0],x[1])[e[0]];return f=="–"?"<td>–</td>":"<td class='w' data-t='"+f+"'>"+f+"</td>"}).join("")+"</tr>"});
 return h+"</table></div><p class='ex'>동사 = động từ, 형용사 = tính từ. 동사 전용 어미는 형용사 칸에 – 로 표시했어요. (Đuôi chỉ dùng cho động từ được đánh dấu –)</p></section>"}

function lsuSec(id){var vs=VB[id].filter(function(z){return z[1]=="v"});
 var h="<section class='c'><h3>2-3. -(으)ㄹ 수 있다 · Có thể</h3><p style='margin:0 0 6px'>동사 어간 + -(으)ㄹ 수 있다. 받침 O → -을 수, 받침 X 또는 ㄹ 받침 → -ㄹ 수. 형용사에는 쓰지 않아요.</p><p class='vi'>Gắn vào thân ĐỘNG TỪ: có patchim → -을 수; không có patchim hoặc patchim ㄹ → -ㄹ 수. Không dùng với tính từ.</p>";
 if(!vs.length)return h+"<p class='ex'>이 불규칙에는 형용사만 있어서 -(으)ㄹ 수 있다를 쓰지 않아요.<br>Nhóm này chỉ có tính từ nên không dùng -(으)ㄹ 수 있다.</p></section>";
 h+="<div class='tbl'><table><tr><th>기본형</th><th>-(으)ㄹ 수 있어요</th></tr>"+vs.slice(0,8).map(function(x){var o=conj(id,x[0],x[1]);return "<tr><td>"+x[0]+"다</td><td class='w' data-t='"+o.lsu+"'>"+o.lsu+"</td></tr>"}).join("")+"</table></div></section>";
 return h}
function stemK(id,st){return VB[id].filter(function(z){return z[0]==st})[0][1]}
function sentSec(id){var S=SN[id];return "<section class='c'><h3>4. 예문 · Ví dụ ("+S.length+" câu)</h3><ul class='sl'>"+S.map(function(q){var f=conj(id,q[1],stemK(id,q[1]))[q[2]];return "<li>"+esc(q[0])+"<b>"+esc(f)+"</b>"+esc(q[3])+" "+spb(q[0]+f+q[3])+"<span class='pr'>"+esc(q[4])+"</span></li>"}).join("")+"</ul></section>"}
function setupP(id){var box=document.getElementById("pq"),mode=1,sel="ayo",vs=VB[id];
 var EQ=EM.filter(function(e){return vs.some(function(x){return conj(id,x[0],x[1])[e[0]]!="–"})});
 function items(){var its=[];
  if(mode==1){vs.forEach(function(x){var f=conj(id,x[0],x[1])[sel];if(f!="–")its.push([x[0]+"다",null,f])})}
  else if(mode==2){var seen={},tries=0;while(its.length<15&&tries++<500){var vb=rnd(vs),e=rnd(EQ),key=vb[0]+e[0],f=conj(id,vb[0],vb[1])[e[0]];if(seen[key]||f=="–")continue;seen[key]=1;its.push([vb[0]+"다 + "+e[1],null,f])}}
  else{SN[id].forEach(function(q){var e=EM.filter(function(z){return z[0]==q[2]})[0];its.push([q[1]+"다 + "+e[1],q,conj(id,q[1],stemK(id,q[1]))[q[2]]])})}
  return its}
 function mk(){var its=items();
  var opts=EQ.map(function(e){return "<option value='"+e[0]+"'"+(e[0]==sel?" selected":"")+">"+e[1]+" ("+e[2]+")</option>"}).join("");
  var h="<h3>3. 연습 · Luyện tập</h3><div class='btns' style='margin:0 0 8px'><button class='"+(mode==1?"":"g")+"' data-m='1'>어미별 · Theo đuôi</button><button class='"+(mode==2?"":"g")+"' data-m='2'>랜덤 · Ngẫu nhiên</button><button class='"+(mode==3?"":"g")+"' data-m='3'>문장 빈칸 · Điền câu</button></div>"+(mode==1?"<p style='margin:0 0 8px'><select id='ps'>"+opts+"</select></p>":"");
  h+="<div class='tbl'><table>"+its.map(function(i){return i[1]?"<tr><td style='text-align:left'>"+esc(i[1][0])+"<input style='width:120px;min-width:90px;margin:0 4px' data-a='"+i[2]+"' autocomplete='off'>"+esc(i[1][3])+"<span class='pr' style='display:block;color:var(--mu);font-size:14px'>("+esc(i[0])+") "+esc(i[1][4])+"</span></td></tr>":"<tr><td>"+i[0]+"</td><td><input data-a='"+i[2]+"' autocomplete='off'></td></tr>"}).join("")+"</table></div><div class='btns'><button id='pk'>정답 확인</button><button class='g' id='pa'>정답 보기</button><button class='g' id='pn'>"+(mode==1?"다시 하기":"새 문제")+"</button><span id='psc' style='align-self:center;color:var(--mu);font-size:14px'></span></div>";
  box.innerHTML=h;
  var ins=box.querySelectorAll("input");
  box.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){mode=+b.dataset.m;mk()}});
  var ps=document.getElementById("ps");if(ps)ps.onchange=function(){sel=ps.value;mk()};
  document.getElementById("pk").onclick=function(){var n=0;ins.forEach(function(i){var ok=cl(i.value)===cl(i.dataset.a);i.className=ok?"ok":"no";if(ok)n++});document.getElementById("psc").textContent=n+" / "+ins.length};
  document.getElementById("pa").onclick=function(){ins.forEach(function(i){i.value=i.dataset.a;i.className="ok"})};
  document.getElementById("pn").onclick=mk}
 mk()}
function spb(t){return "<button class='sp' data-t='"+t+"' aria-label='듣기'>🔊</button>"}
function sp(w){return w+" "+spb(w)}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-t]");if(!b)return;try{var s=window.speechSynthesis;s.cancel();var u=new SpeechSynthesisUtterance(b.dataset.t);u.lang="ko-KR";u.rate=.85;var v=s.getVoices().filter(function(x){return x.lang&&x.lang.replace("_","-").indexOf("ko")===0})[0];if(v)u.voice=v;s.speak(u)}catch(err){}});
window.addEventListener("hashchange",render);render();
